@name Coolify Beacon - Classic Center
@namespace github.com/ncjsvr/Coolify-Beacon-Style

@description An information-first Coolify interface: clear state, readable tables, quiet controls.

/*
 * Coolify v4.5.3 presentation overrides. No instance hostname is stored here.
 * Every selector requires Coolify's branded app shell, including on mobile.
 * Design process: Unslop by Damir Sokolovsky (@heydamir), CC BY 4.0
 * https://heydamir.design/unslop
 */

    html:has(.app-shell .app-topbar-brand a[title="Coolify"]) {
        --beacon-canvas: #151617;
        --beacon-sidebar: #111214;
        --beacon-panel: #1B1D1F;
        --beacon-surface: #202225;
        --beacon-raised: #272A2D;
        --beacon-selected: #2D3034;
        --beacon-ink: #EDEDF0;
        --beacon-secondary: #B5B8BF;
        --beacon-muted: #9DA2AA;
        --beacon-line: rgba(237, 237, 240, 0.1);
        --beacon-control-line: rgba(237, 237, 240, 0.18);
        --beacon-warning: #E6B45C;
        --beacon-success: #69C99D;
        --beacon-error: #F08B8D;
        --beacon-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
        --beacon-main-top: 24px;
        --beacon-main-bottom: 32px;
        --beacon-ease: cubic-bezier(0.22, 1, 0.36, 1);
        color-scheme: dark;
        scroll-padding-top: 96px;
    }

    /* Palette is supplied by Stylus, including Coolify's separately derived
       sidebar tokens. No Profile / Appearance configuration is required. */
    html:has(.app-shell .app-topbar-brand a[title="Coolify"]),

        --theme-bg: var(--beacon-canvas) !important;
        --theme-text: var(--beacon-ink) !important;
        --theme-light: 0 !important;

        --theme-sidebar-text: var(--beacon-ink) !important;
        --theme-sidebar-light: 0 !important;
        --theme-base-color: var(--beacon-ink) !important;
        --theme-bright-color: var(--beacon-ink) !important;
        --theme-accent-foreground: var(--beacon-canvas) !important;
        --theme-fg-on-surface: var(--beacon-ink) !important;
        --theme-scrollbar-thumb: #555B62 !important;
        --theme-placeholder-color: var(--beacon-muted) !important;
        --t-bg: var(--beacon-canvas) !important;
        --t-text: var(--beacon-ink) !important;
        --t-light: 0 !important;
        --color-app: var(--beacon-canvas) !important;
        --color-panel: var(--beacon-sidebar) !important;
        --color-sidebar: var(--beacon-sidebar) !important;
        --color-base: var(--beacon-panel) !important;
        --color-card: var(--beacon-panel) !important;
        --color-surface: var(--beacon-panel) !important;

        --color-coolgray-300: var(--beacon-raised) !important;
        --color-coolgray-400: var(--beacon-selected) !important;
        --color-coolgray-500: #393D42 !important;

        --color-brand: var(--beacon-ink) !important;

        --color-coollabs-200: #D5D7DC !important;

        --color-fg: var(--beacon-ink) !important;

<div class="page-heading"><h1>Environment variables</h1><button class="button">Add</button></div>
<section class="application-settings-workspace w-full"><div class="workspace-grid"><aside class="application-settings-navigation in-main-nav"><nav><a class="menu-item">General</a><a class="menu-item">Domains</a><a class="menu-item">Advanced</a><a class="menu-item menu-item-active">Environment variables</a><a class="menu-item">Persistent storage</a><a class="menu-item">Deployments</a><a class="menu-item">Logs</a></nav></aside><div class="application-settings-form min-w-0"><section class="application-settings-section"><header><h3>Environment variables</h3></header><div class="application-settings-section-body is-flush"><div class="environment-table-scroll"><div class="data-table"><div class="data-table-header env-table-grid"><span>Name</span><span>Managed</span><span>Type</span><span>Literal</span><span>Multiline</span><span>Buildtime</span><span>Runtime</span><span></span></div><div id="env-rows"></div></div></div></div></section></div></div></section>
</template>
<template id="metrics">
<div class="page-heading"><div><h1>Metrics</h1><p class="text-neutral-500">edge-01</p></div></div><div class="resource-toolbar"><select class="select"><option>Last hour</option></select><button class="button">Live</button></div><div class="stack gap-6"><section class="application-settings-section" id="cpu-metrics-section"><header><h3>CPU usage</h3></header><div class="application-settings-section-body" data-chart="cpu"></div></section><section class="application-settings-section" id="memory-metrics-section"><header><h3>Memory usage</h3></header><div class="application-settings-section-body" data-chart="memory"></div></section></div>
</template>
<template id="logs">
<div class="page-heading"><div><h1>Logs</h1><p class="text-neutral-500">api-gateway / production</p></div></div><div class="runtime-logs-page"><section class="application-settings-workspace"><div class="grid"><section class="application-settings-section logs-settings-section"><header><h3>Runtime logs</h3><div class="flex gap-2"><select class="select"><option>api-gateway</option></select><button class="button">Follow logs</button></div></header><div class="application-settings-section-body is-flush"><div class="runtime-log-shell"><div class="log-toolbar"><input class="input h-7" data-compact-input placeholder="Search logs"></div><pre class="logs-viewer">2026-11-01T12:31:04Z  INFO  Server listening on 0.0.0.0:3000
2026-11-01T12:31:05Z  INFO  Database connection ready
2026-11-01T12:31:06Z  INFO  Health check passed
2026-11-01T12:32:14Z  INFO  GET /api/status 200 12ms
2026-11-01T12:32:19Z  WARN  Retrying upstream request after timeout
2026-11-01T12:32:20Z  INFO  Upstream request completed 200 142ms
2026-11-01T12:33:01Z  INFO  GET /api/status 200 9ms
2026-11-01T12:33:12Z  ERROR Connection reset by peer
2026-11-01T12:33:13Z  INFO  Reconnected to upstream</pre></div></div></section></div></section></div>
</template>
<template id="canvas">
<div data-canvas-root><div class="canvas-viewport" style="transform:matrix(1,0,0,1,0,0)"><svg class="canvas-edges" width="1200" height="700" aria-hidden="true"><path d="M300 220H470V380H650" fill="none" stroke="#52525b" stroke-width="2"/></svg><div class="resource-view canvas-node" style="left:120px;top:150px;width:180px"><strong>api-gateway</strong><span data-badge="Running|success"></span></div><div class="resource-view canvas-node" style="left:650px;top:330px;width:180px"><strong>postgres</strong><span data-badge="Running|success"></span></div></div></div>
</template>
<script>
const content=document.querySelector('#sample-content'),select=document.querySelector('#sample-page');
const navPaths=['M3 10 12 3l9 7M5 9v12h5v-7h4v7h5V9','M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z','M3 17h3l3-9 5 12 4-14 3 11','m5 6 6 6-6 6M13 18h6','M4 4h16v6H4zM4 14h16v6H4zM7 7h.01M7 17h.01','m8 4-4 4 4 4M16 12l4 4-4 4M4 8h12M8 16h12','M8 3H5v18h3M16 3h3v18h-3M10 10h4M10 14h4','M8 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM2 22v-3a6 6 0 0 1 12 0v3M16 4a4 4 0 0 1 0 8M17 16a5 5 0 0 1 5 5','M5 17h14l-2-3V8a5 5 0 0 0-10 0v6l-2 3ZM10 21h4','M14 10a6 6 0 1 0-5 5l3 3 2-2 2 2 3-3-6-6','M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8ZM10 2h4l1 4 4 1 3 3v4l-4 1-1 4-3 3h-4l-1-4-4-1-3-3v-4l4-1 1-4Z'];
document.querySelectorAll('.app-sidebar span.menu-item-icon').forEach((el,i)=>{el.outerHTML='<svg class="menu-item-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="'+navPaths[i%navPaths.length]+'" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'});
function badge(label,type){const dot=type==='success'?'emerald-500':type==='error'?'red-500':type;return '<span class="inline-flex h-6 max-w-full items-center gap-1.5 whitespace-nowrap rounded-full border border-neutral-200 bg-neutral-100 px-2 text-xs font-medium leading-none text-neutral-700 dark:border-white/[0.12] dark:bg-white/[0.07] dark:text-white" data-status="'+type+'"><span class="relative flex size-1.5 shrink-0"><span class="relative inline-flex size-1.5 rounded-full bg-'+dot+'"></span></span><span class="truncate">'+label+'</span></span>'}
const rows=[['In progress','warning','Webhook','c34f6d1','Restore health checks','35 sec ago','35s','edge-01'],['Success','success','Manual','a4e91c8','Update application configuration','12 minutes ago','1m 42s','edge-01'],['Failed','error','Webhook','4d3b2a1','Refresh runtime image','48 minutes ago','54s','build-01'],['Success','success','API','3fe7a29','Update service settings','2 hours ago','1m 18s','edge-01']];
function deploymentTable(embedded){const headers=embedded?['Source','Commit','Duration','Server','Status']:['Status','Source','Commit','Started','Duration','Server'];return '<div class="data-table-header deployment-table-grid">'+headers.map(x=>'<span>'+x+'</span>').join('')+'</div>'+rows.map((r,i)=>{const commit='<span class="min-w-0"><span class="flex items-center gap-2"><a class="font-mono text-xs" href="#">'+r[3]+'</a><span class="truncate text-neutral-500 dark:text-fg-faint">'+r[4]+'</span></span>'+(embedded?'<span class="embedded-meta text-xs text-neutral-500">'+r[2]+' · '+r[6]+' · '+r[7]+'</span>':'')+'</span>';const cells=embedded?['<span>'+r[2]+'</span>',commit,'<span class="tabular-nums">'+r[6]+'</span>','<span>'+r[7]+'</span>','<span>'+badge(r[0],r[1])+'</span>']:['<span>'+badge(r[0],r[1])+'</span>','<span>'+r[2]+'</span>',commit,'<span>'+r[5]+'</span>','<span class="tabular-nums">'+r[6]+'</span>','<span>'+r[7]+'</span>'];return '<div class="data-table-row deployment-table-row deployment-table-grid '+(i===0?'data-table-row-active':'')+'">'+cells.join('')+'</div>'}).join('')}
function chart(name,values,color){const points=values.map((v,i)=>(40+i*84)+','+(220-v*1.8)).join(' ');return '<svg class="apexcharts-svg" viewBox="0 0 680 260" role="img" aria-label="'+name+'"><g class="apexcharts-grid" stroke="#38383d" stroke-width="1">'+[40,85,130,175,220].map(y=>'<line x1="40" y1="'+y+'" x2="640" y2="'+y+'"/>').join('')+'</g><g fill="#929299" font-size="11" font-family="monospace"><text x="5" y="45">100</text><text x="12" y="135">50</text><text x="20" y="225">0</text></g><polyline class="apexcharts-line" fill="none" stroke="'+color+'" stroke-width="2.5" points="'+points+'"/><g fill="#929299" font-size="11" font-family="monospace"><text x="40" y="250">12:00</text><text x="292" y="250">12:30</text><text x="605" y="250">13:00</text></g></svg>'}
function nativeSectionHeadings(){
  content.querySelectorAll('.section-heading').forEach(node=>{
    const title=node.querySelector(':scope > h2');if(!title)return;
    const actions=Array.from(node.children).filter(child=>child!==title);
    node.className='mb-3 min-w-0';
    const row=document.createElement('div');row.className='flex flex-wrap items-center justify-between gap-x-4 gap-y-2';
    const label=document.createElement('div');label.className='flex min-w-0 items-baseline gap-2';
    const inner=document.createElement('div');inner.className='flex min-w-0 items-center gap-1';
    title.className='min-w-0 truncate text-[14px]! leading-5! font-semibold! text-black dark:text-fg';
    inner.append(title);label.append(inner);row.append(label);
    if(actions.length){const group=document.createElement('div');group.className='ml-auto flex shrink-0 items-center gap-3';group.append(...actions);row.append(group)}
    node.replaceChildren(row);
  });
}
function showScreen(name){name=String(name||'dashboard').toLowerCase();const template=document.getElementById(name);if(!(template instanceof HTMLTemplateElement))return showScreen('dashboard');content.replaceChildren(template.content.cloneNode(true));document.querySelector('.app-main').classList.toggle('app-main-full',name==='canvas');select.value=name[0].toUpperCase()+name.slice(1);document.querySelector('#sample-context').textContent=select.value;document.body.dataset.screen=name;history.replaceState(null,'','#'+name);
nativeSectionHeadings();
content.querySelectorAll('[data-badge]').forEach(e=>{const p=e.dataset.badge.split('|');e.innerHTML=badge(p[0],p[1])});
if(name==='resources'){content.querySelector('#resource-rows').innerHTML=[['api-gateway','Application','Running','api.example.test','edge-01','production'],['worker','Application','Running','—','build-01','jobs'],['postgres','PostgreSQL','Running','—','edge-01','data'],['redis','Redis','Stopped','—','edge-01','cache']].map(r=>'<div class="environment-resource-grid table-row"><a href="#" class="resource-name">'+r[0]+'</a><div class="resource-type text-neutral-500">'+r[1]+'</div><div>'+badge(r[2],r[2]==='Running'?'success':'neutral')+'</div><div class="resource-domain text-neutral-500">'+r[3]+'</div><div class="resource-server text-neutral-500">'+r[4]+'</div><div class="resource-tags text-neutral-500">'+r[5]+'</div></div>').join('')}
if(name==='deployments'){content.querySelector('#full-deployment').innerHTML=deploymentTable(false);content.querySelector('#embedded-deployment').innerHTML=deploymentTable(true)}
if(name==='environment'){content.querySelector('#env-rows').innerHTML=[['APP_ENV','production'],['LOG_LEVEL','info'],['DATABASE_URL','••••••••••••••••']].map(r=>'<div class="env-table-item"><div class="data-table-row env-table-grid"><div><strong class="font-mono">'+r[0]+'</strong><p class="text-neutral-500 font-mono">'+r[1]+'</p></div><span>—</span><span>Production</span>'+[false,false,false,true].map(v=>'<span><input type="checkbox" '+(v?'checked':'')+' aria-label="Variable option"></span>').join('')+'<button class="button">Edit</button></div></div>').join('')}
if(name==='metrics'){content.querySelector('[data-chart="cpu"]').innerHTML=chart('CPU usage',[12,17,15,43,38,21,14,16],'#e6b75a');content.querySelector('[data-chart="memory"]').innerHTML=chart('Memory usage',[32,34,38,42,45,43,40,40],'#a8b4bc')}
window.scrollTo(0,0)}
select.addEventListener('change',()=>showScreen(select.value));showScreen(location.hash.slice(1));document.addEventListener('click',e=>{if(e.target.closest('a[href="#"]'))e.preventDefault()});window.showScreen=showScreen;
</script>
</body></html>
